<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบเจ้าหน้าที่ - ศูนย์ป่าไม้ขอนแก่น</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #e9ecef; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-tree text-success fa-3x mb-2"></i>
            <h4 class="fw-bold">ระบบเจ้าหน้าที่</h4>
            <p class="text-muted small">ศูนย์ป่าไม้ขอนแก่น</p>
        </div>
        <div id="alertBox"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">ชื่อผู้ใช้งาน</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">รหัสผ่าน</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 mb-2" id="loginBtn">เข้าสู่ระบบ</button>
            <a href="index.html" class="btn btn-outline-secondary w-100 btn-sm">กลับสู่หน้าแรก</a>
        </form>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwNe1W4XFNW3EMOs7JEWOb7HaU0FCvUDCY4THURjM50MD5b9YDJckKtuY4fvV1ZJ8naww/exec";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = "กำลังตรวจสอบ...";

            let payload = {
                action: "login",
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    localStorage.setItem("user", JSON.stringify(data));
                    window.location.href = "admin.html";
                } else {
                    document.getElementById('alertBox').innerHTML = `<div class="alert alert-danger py-2 small">${data.message}</div>`;
                    btn.disabled = false;
                    btn.innerHTML = "เข้าสู่ระบบ";
                }
            }).catch(err => {
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อ");
                btn.disabled = false;
                btn.innerHTML = "เข้าสู่ระบบ";
            });
        });
    </script>
</body>
</html>
