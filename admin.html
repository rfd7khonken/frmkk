<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหลังบ้าน - ศูนย์ป่าไม้ขอนแก่น</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #198754; color: white; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 12px 20px; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: #157347; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0 sidebar d-flex flex-column justify-content-between">
                <div>
                    <div class="p-3 text-center border-bottom">
                        <h5 class="fw-bold mb-0">Admin Panel</h5>
                        <small id="userFullName"></small>
                    </div>
                    <div class="py-2">
                        <a href="#" onclick="switchTab('news')" class="active" id="nav-news"><i class="fa-solid fa-bullhorn me-2"></i>จัดการข่าวสาร</a>
                        <a href="#" onclick="switchTab('docs')" id="nav-docs"><i class="fa-solid fa-file-lines me-2"></i>จัดการเอกสาร</a>
                        <a href="#" onclick="switchTab('logs')" id="nav-logs"><i class="fa-solid fa-clock-rotate-left me-2"></i>Activity Log</a>
                    </div>
                </div>
                <div class="p-3 border-top">
                    <button onclick="logout()" class="btn btn-outline-light w-100 btn-sm"><i class="fa-solid fa-right-from-bracket me-1"></i>ออกจากระบบ</button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4">
                <!-- News Tab -->
                <div id="tab-news" class="content-tab">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3>จัดการข่าวสารประชาสัมพันธ์</h3>
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#newsModal"><i class="fa-solid fa-plus me-1"></i>เพิ่มข่าวใหม่</button>
                    </div>
                    <div class="card p-3 shadow-sm">
                        <table class="table table-hover align-middle">
                            <thead class="table-success"><tr><th>หัวข้อข่าว</th><th>ผู้สร้าง</th><th>วันที่</th><th>จัดการ</th></tr></thead>
                            <tbody id="adminNewsTable"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Documents Tab -->
                <div id="tab-docs" class="content-tab d-none">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3>จัดการเอกสาร (Google Drive Link)</h3>
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#docModal"><i class="fa-solid fa-plus me-1"></i>เพิ่มเอกสาร</button>
                    </div>
                    <div class="card p-3 shadow-sm">
                        <table class="table table-hover align-middle">
                            <thead class="table-success"><tr><th>ชื่อเอกสาร</th><th>หมวดหมู่</th><th>ลิงก์ดาวน์โหลด</th><th>ผู้ลง</th><th>จัดการ</th></tr></thead>
                            <tbody id="adminDocTable"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Logs Tab -->
                <div id="tab-logs" class="content-tab d-none">
                    <h3 class="mb-4">ประวัติการใช้งานระบบ (Activity Log)</h3>
                    <div class="card p-3 shadow-sm">
                        <table class="table table-striped align-middle">
                            <thead class="table-dark"><tr><th>ผู้ใช้งาน</th><th>กิจกรรม</th><th>รายละเอียด</th><th>เวลา</th></tr></thead>
                            <tbody id="logTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- News Modal -->
    <div class="modal fade" id="newsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">เพิ่มข่าวสารใหม่</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="newsForm">
                        <div class="mb-3"><label class="form-label">หัวข้อข่าว</label><input type="text" id="newsTitle" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">เนื้อหาข่าว</label><textarea id="newsContent" rows="4" class="form-control" required></textarea></div>
                        <button type="submit" class="btn btn-success w-100">บันทึกข่าว</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Document Modal -->
    <div class="modal fade" id="docModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">เพิ่มเอกสารดาวน์โหลด</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="docForm">
                        <div class="mb-3"><label class="form-label">ชื่อเอกสาร</label><input type="text" id="docTitle" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">หมวดหมู่</label><input type="text" id="docCategory" class="form-control" placeholder="เช่น คำสั่ง, ระเบียบ, แบบฟอร์ม" required></div>
                        <div class="mb-3"><label class="form-label">ลิงก์ Google Drive (แชร์สาธารณะ)</label><input type="url" id="docUrl" class="form-control" required></div>
                        <button type="submit" class="btn btn-success w-100">บันทึกเอกสาร</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "YOUR_APPS_SCRIPT_URL_HERE";
        let currentUser = JSON.parse(localStorage.getItem("user"));

        if(!currentUser) {
            window.location.href = "login.html";
        } else {
            document.getElementById('userFullName').innerText = currentUser.fullname + " (" + currentUser.role + ")";
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadAdminNews();
            loadAdminDocs();
            loadLogs();
        });

        function switchTab(tab) {
            document.querySelectorAll('.content-tab').forEach(el => el.classList.add('d-none'));
            document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.remove('d-none');
            document.getElementById('nav-' + tab).classList.add('active');
        }

        function loadAdminNews() {
            fetch(API_URL + "?action=getNews").then(res => res.json()).then(data => {
                if(data.status === "success") {
                    let html = "";
                    data.data.forEach(item => {
                        html += `<tr><td>${item.title}</td><td>${item.author}</td><td>${new Date(item.created_at).toLocaleDateString('th-TH')}</td><td><button onclick="deleteItem('News', '${item.news_id}')" class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button></td></tr>`;
                    });
                    document.getElementById('adminNewsTable').innerHTML = html;
                }
            });
        }

        function loadAdminDocs() {
            fetch(API_URL + "?action=getDocuments").then(res => res.json()).then(data => {
                if(data.status === "success") {
                    let html = "";
                    data.data.forEach(item => {
                        html += `<tr><td>${item.title}</td><td><span class="badge bg-secondary">${item.category}</span></td><td><a href="${item.file_url}" target="_blank">เปิดลิงก์</a></td><td>${item.uploaded_by}</td><td><button onclick="deleteItem('Documents', '${item.doc_id}')" class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button></td></tr>`;
                    });
                    document.getElementById('adminDocTable').innerHTML = html;
                }
            });
        }

        function loadLogs() {
            fetch(API_URL + "?action=getLogs").then(res => res.json()).then(data => {
                if(data.status === "success") {
                    let html = "";
                    data.data.reverse().forEach(item => {
                        html += `<tr><td>${item.username}</td><td><span class="badge bg-info">${item.action}</span></td><td>${item.details}</td><td>${new Date(item.timestamp).toLocaleString('th-TH')}</td></tr>`;
                    });
                    document.getElementById('logTable').innerHTML = html;
                }
            });
        }

        document.getElementById('newsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let payload = { action: "saveNews", title: document.getElementById('newsTitle').value, content: document.getElementById('newsContent').value, author: currentUser.username };
            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }).then(res => res.json()).then(data => {
                alert(data.message);
                location.reload();
            });
        });

        document.getElementById('docForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let payload = { action: "saveDocument", title: document.getElementById('docTitle').value, category: document.getElementById('docCategory').value, file_url: document.getElementById('docUrl').value, uploaded_by: currentUser.username };
            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }).then(res => res.json()).then(data => {
                alert(data.message);
                location.reload();
            });
        });

        function deleteItem(sheetName, id) {
            if(confirm("ยืนยันการลบข้อมูลใช่หรือไม่?")) {
                let payload = { action: "deleteItem", sheetName: sheetName, id: id, username: currentUser.username };
                fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }).then(res => res.json()).then(data => {
                    alert(data.message);
                    location.reload();
                });
            }
        }

        function logout() {
            localStorage.removeItem("user");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
